res_tyndp_mapping:
  offwind-ac-fb-r: offwind-ac
  hydro-ror: ror
  onwind: onwind
  solar-pv-utility: solar
  solar-pv-rooftop: solar rooftop
  # dsr: false
  offwind-dc-fb-r: offwind-dc
  # offwind-h2-fb-oh: false
  # offwind-dc-fb-oh: offwind-dc

store_tyndp_mapping:
  battery: battery
  H2 cavern-storage: H2 Store
