tennet_adjustment:
  tennet_xlsx: "data/ISIE/260821 - ElSysOp transfer capacities and regionalisation_transmission_2040.xlsx"
  tennet_capacity:
    enable: true
    type: summer effective
    extendable: true
    method: s_max_pu # "circuit" , "s_max_pu" or "s_nom_max"
    max_circuit: 6
    s_nom_max: 8000
    s_max_pu: 2.0
  load:
    enable: true
    refactor: false
      # DSO_Households_hp_electric: 0.5 # Minder Elektrificatie
      # DSO_Households_hp_hybrid: 2.26 # Minder Elektrificatie
  battery_system:
    TSO:
      enable: true
      power_cap: 0
      max_load: 8
      extendable: true
    DSO:
      enable: true
      power_cap: 0
      max_load: 4
      extendable: true
  extend_h2_tank: true
  renewables:
    adjustment: []
      # onwind: 15100.0
      # solar-pv-utility: 40706.345
      # solar-pv-rooftop: 85433.072
    by_tennet: false
  extendable_carriers:
    Generator: []
    # - onwind
    # - solar-pv-utility
    # - solar-pv-rooftop
    # - offwind-ac-fb-r
    # - offwind-ac-fl-r
    # - offwind-dc-fb-r
    # - offwind-dc-fl-r
    # - offwind-dc-fb-oh
    # - offwind-dc-fl-oh
    # - offwind-h2-fb-oh
    # - offwind-h2-fl-oh

offshore_buses: true

solving:
  solver:  # Use commercial solver for high resolution results in SB
    name: gurobi
    options: gurobi-default

