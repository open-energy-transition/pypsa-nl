tennet_adjustment:
  tennet_xlsx: "data/ISIE/260821 - ElSysOp transfer capacities and regionalisation_transmission_2040.xlsx"
  tennet_capacity:
    enable: true
    year: "2026"
    type: winter effective
    extendable: true
    method: s_nom_max # "circuit" , "s_max_pu" or "s_nom_max"
    max_circuit: 6
    s_nom_max: 8000
    s_max_pu: 2.0
  offshore_buses: true
  load:
    enable: true
    refactor: false
      # DSO_Households_hp_electric: 0.5 # Minder Elektrificatie
      # DSO_Households_hp_hybrid: 2.26 # Minder Elektrificatie
  battery_system:
    TSO:
      enable: true
      power_cap: 27000
      max_load: 8
      extendable: false
    DSO:
      enable: true
      power_cap: 8400
      max_load: 4
      extendable: false
    extendable: false
  extend_h2_tank: true
  renewables:
    by_tennet: false
  min_ext_factor: 0.0
  extendable_carriers:
  - onwind
  - solar-pv-utility
  - solar-pv-rooftop
  - offwind-ac-fb-r
  - offwind-ac-fl-r
  - offwind-dc-fb-r
  - offwind-dc-fl-r
  - offwind-dc-fb-oh
  - offwind-dc-fl-oh
  - offwind-h2-fb-oh
  - offwind-h2-fl-oh

