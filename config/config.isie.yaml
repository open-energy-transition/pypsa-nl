# snakemake solve_sector_networks --configfile config/config.tyndp.yaml config/config.isie.yaml -n

# snakemake solve_sector_networks --configfile config/test/config.tyndp.yaml config/config.isie.yaml -n
# pixi shell -e open-tyndp

run:
  name: "tyndp-isie-2050"
  scenarios:
    enable: false
    file: config/scenarios.tyndp.yaml

scenario:
  clusters:
  - all
  planning_horizons:
  #- 2040
  - 2050  # single run myopic

# TODO set foresight
foresight: myopic

tyndp_scenario: NT

launch_explorer: true

clustering:
  temporal:
    resolution_sector: 1H  # Use 1H for high resolution results in SB (requires commercial solver) 168H

final_adjustment: true

solving:
  solver:  # Use commercial solver for high resolution results in SB
    name: gurobi
    options: gurobi-default

tennet_adjustment:
  tennet_xlsx: "data/ISIE/260821 - ElSysOp transfer capacities and regionalisation_transmission_2040.xlsx"
  tennet_capacity:
    enable: true
    type: winter effective
    s_nom_extendable: false
    s_nom_max: 1.0
  load: true
  battery_system:
    enable: true
    power_cap: 27000
    max_load: 8
  renewables: true

offshore_buses: true