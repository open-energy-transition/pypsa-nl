# snakemake solve_networks --configfile config/config.tyndp.yaml config/config.isie.yaml -call

# snakemake solve_networks --configfile config/test/config.tyndp.yaml config/config.isie.yaml -call
# pixi shell -e open-tyndp

run:
  name: "tyndp-isie-2040"
  scenarios:
    enable: false
    file: config/scenarios.tyndp.yaml

planning_horizons:
- 2040

# TODO set foresight
foresight: myopic

tyndp_scenario: NT

launch_explorer: true

clustering:
  temporal:
    # Important note: The segmentation (SEG) option is currently not supported, for details https://github.com/open-energy-transition/open-tyndp/pull/345
    averaging: 1h  # Set to false for 1h high-resolution SB results (requires commercial solver)

final_adjustment: true

solving:
  options:
    load_shedding:
      enable: true
      all_carriers: false
      carriers:
        H2: 3000
        AC: 3000
    custom_extra_functionality: ../data/ISIE/custom_extra_functionality.py
  solver:  # Use commercial solver for high resolution results in SB
    name: gurobi
    options: gurobi-default

tennet_adjustment:
  tennet_xlsx: "data/ISIE/260821 - ElSysOp transfer capacities and regionalisation_transmission_2040.xlsx"
  tennet_capacity:
    enable: true
    type: winter effective
    extendable: false
    method: s_max_pu # "circuit" , "s_max_pu" or "s_nom_max"
    max_circuit: 6
    s_nom_max: 8000
    s_max_pu: 1.1
  load: true
  battery_system:
    enable: true
    power_cap: 27000
    max_load: 8
    extendable: false
  renewables:
    expandable:
      # onwind: 15100.0
      solar-pv-utility: 40706.345
      solar-pv-rooftop: 85433.072
      offwind-ac-fb-r: false
      offwind-dc-fb-r: false
      offwind-dc-fb-oh: false
      offwind-h2-fb-oh: false
    by_tennet: false

offshore_buses: true
